<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personagens Chespirito</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        
        <header class="hero-section fade-in">
            <img 
                src="imagens/personagens-iconicos-de-chespirito.png"
                alt="Personagens Chespirito"
                class="hero-img-desktop"
            />
            
            <div class="hero-grid-mobile">
                <div class="grid-item bg-yellow-400">
                    <img src="imagens/chaves-responsivo.png" class="obj-pos-1" alt="Chaves, gerado por IA">
                </div>
                <div class="grid-item bg-red-500">
                    <img src="imagens/chapolin-responsivo.png" class="obj-pos-2" alt="Chapolin, gerado por IA">
                </div>
                <div class="grid-item bg-blue-500">
                    <img src="imagens/doutor-chapatin-responsivo.png" class="obj-pos-3" alt="Doutor Chapatin, gerado por IA">
                </div>
                <div class="grid-item bg-gray-500">
                    <img src="imagens/chompiras-responsivo.png" class="obj-pos-4" alt="Chompiras, gerado por IA">
                </div>
            </div>
        </header>

        <nav class="sticky-nav">
            <div class="nav-container" id="nav-buttons">
                </div>
        </nav>

        <main id="main-content" class="content-wrapper">
            </main>

        <footer class="main-footer">
            <div class="footer-content">
                <p class="footer-text">
                    Uma homenagem a <span class="font-white">Roberto Gómez Bolaños</span>
                </p>
                <p class="footer-subtext">
                    Chespirito • 1929 - 2014
                </p>
                <div class="footer-dots">
                    <div class="dot bg-yellow-400"></div>
                    <div class="dot bg-red-500"></div>
                    <div class="dot bg-blue-500"></div>
                    <div class="dot bg-gray-400"></div>
                </div>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
